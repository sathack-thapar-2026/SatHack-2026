<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 740 460' width='740' height='460'>
  <!-- Crisp Card Container (Light Aesthetic) -->
  <rect width='738' height='458' x='1' y='1' rx='22' ry='22' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1.5'/>

  <!-- Light Blue Top Accent Indicator (Card 5 Theme) -->
  <path d='M 22 1 L 718 1 A 22 22 0 0 1 739 22 L 739 26 L 1 26 L 1 22 A 22 22 0 0 1 22 1 Z' fill='#0891B2' fill-opacity='0.15'/>
  <line x1='1' y1='26' x2='739' y2='26' stroke='#E2E8F0' stroke-width='1'/>

  <!-- Top Stage Badge (No Secondary Heading) -->
  <g transform='translate(48, 44)'>
    <rect width='84' height='25' rx='7' fill='#ECFEFF' stroke='#A5F3FC' stroke-width='1'/>
    <text x='11' y='16.5' fill='#0891B2' font-size='11' font-weight='800' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif' letter-spacing='0.5'>STAGE 01</text>
  </g>

  <!-- Title & Subtitle -->
  <text x='48' y='114' fill='#0F172A' font-size='25' font-weight='800' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif' letter-spacing='-0.3'>Agree on Stages &amp; Budgets</text>
  <text x='48' y='142' fill='#475569' font-size='13.5' font-weight='450' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Break projects into transparent milestones with agreed deliverables and locked prices.</text>

  <!-- Divider -->
  <line x1='48' y1='168' x2='692' y2='168' stroke='#F1F5F9' stroke-width='1'/>

  <!-- Clean Agreement Details Box (No Generic Bullets) -->
  <g transform='translate(48, 186)'>
    <rect width='644' height='162' rx='14' fill='#F8FAFC' stroke='#E2E8F0' stroke-width='1'/>
    
    <!-- Tranche 1 -->
    <g transform='translate(22, 22)'>
      <text x='0' y='14' fill='#0F172A' font-size='14' font-weight='700' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Stage 01: Wireframes &amp; Design Architecture</text>
      <text x='0' y='32' fill='#64748B' font-size='12' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Figma design tokens, responsive layouts, components</text>
      <text x='530' y='22' fill='#0891B2' font-size='14.5' font-weight='800' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>₹15,000</text>
    </g>

    <line x1='22' y1='76' x2='622' y2='76' stroke='#E2E8F0' stroke-width='1'/>

    <!-- Tranche 2 -->
    <g transform='translate(22, 98)'>
      <text x='0' y='14' fill='#0F172A' font-size='14' font-weight='700' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Stage 02: Core Frontend &amp; API Integration</text>
      <text x='0' y='32' fill='#64748B' font-size='12' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Working web application, state management, checkout routes</text>
      <text x='530' y='22' fill='#0891B2' font-size='14.5' font-weight='800' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>₹25,000</text>
    </g>
  </g>

  <!-- Bottom Summary Note -->
  <g transform='translate(48, 382)'>
    <rect width='644' height='36' rx='9' fill='#F0FDFA' stroke='#CCFBF1' stroke-width='1'/>
    <text x='20' y='22.5' fill='#0F766E' font-size='12' font-weight='600' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Mutual agreement locked • Both parties aligned before any work begins</text>
  </g>
</svg>