<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 740 460' width='740' height='460'>
    <!-- Crisp Card Container (Light Aesthetic) -->
    <rect width='738' height='458' x='1' y='1' rx='22' ry='22' fill='#FFFFFF' stroke='#E2E8F0' stroke-width='1.5'/>

    <!-- Subtle Top Accent Indicator -->
    <path d='M 22 1 L 718 1 A 22 22 0 0 1 739 22 L 739 26 L 1 26 L 1 22 A 22 22 0 0 1 22 1 Z' fill='#D97706' fill-opacity='0.15'/>
    <line x1='1' y1='26' x2='739' y2='26' stroke='#E2E8F0' stroke-width='1'/>

    <!-- Top Stage Badges -->
    <g transform='translate(48, 44)'>
      <rect width='84' height='25' rx='7' fill='#FFFBEB' stroke='#FDE68A' stroke-width='1'/>
      <text x='11' y='16.5' fill='#D97706' font-size='11' font-weight='800' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif' letter-spacing='0.5'>STAGE 04</text>
      
      <rect x='94' width='168' height='25' rx='7' fill='#F8FAFC' stroke='#E2E8F0' stroke-width='1'/>
      <circle cx='107' cy='12.5' r='3.5' fill='#D97706'/>
      <text x='118' y='16.5' fill='#475569' font-size='11' font-weight='600' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>ESCROW SETTLEMENT</text>
    </g>

    <!-- Title & Subtitle -->
    <text x='48' y='116' fill='#0F172A' font-size='25' font-weight='800' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif' letter-spacing='-0.3'>Approve &amp; Release Payments</text>
    <text x='48' y='144' fill='#475569' font-size='13.5' font-weight='450' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>When satisfied with the verified work, tap Approve to release funds immediately.</text>

    <!-- Divider -->
    <line x1='48' y1='174' x2='692' y2='174' stroke='#F1F5F9' stroke-width='1'/>

    <!-- 3 Checklist Items -->
    
      <g transform='translate(48, 208)'>
        <rect width='28' height='28' rx='8' fill='#FFFBEB' stroke='#FDE68A' stroke-width='1.2'/>
        <path d='M8 14.5l3.5 3.5 8-8' fill='none' stroke='#D97706' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/>
        <text x='42' y='14' fill='#0F172A' font-size='14.5' font-weight='700' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Human-in-the-Loop Control</text>
        <text x='42' y='32' fill='#64748B' font-size='12' font-weight='450' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Funds never move automatically; the client retains 100% control</text>
      </g>
    
      <g transform='translate(48, 264)'>
        <rect width='28' height='28' rx='8' fill='#FFFBEB' stroke='#FDE68A' stroke-width='1.2'/>
        <path d='M8 14.5l3.5 3.5 8-8' fill='none' stroke='#D97706' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/>
        <text x='42' y='14' fill='#0F172A' font-size='14.5' font-weight='700' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Instant Payout Dispatch</text>
        <text x='42' y='32' fill='#64748B' font-size='12' font-weight='450' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Freelancers get paid promptly without arbitrary settlement delays</text>
      </g>
    
      <g transform='translate(48, 320)'>
        <rect width='28' height='28' rx='8' fill='#FFFBEB' stroke='#FDE68A' stroke-width='1.2'/>
        <path d='M8 14.5l3.5 3.5 8-8' fill='none' stroke='#D97706' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/>
        <text x='42' y='14' fill='#0F172A' font-size='14.5' font-weight='700' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Direct Bank &amp; Card Routing</text>
        <text x='42' y='32' fill='#64748B' font-size='12' font-weight='450' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>Direct payout to bank accounts, debit cards, and local payment rails</text>
      </g>
    

    <!-- Bottom Status / Verification Pill -->
    <g transform='translate(48, 396)'>
      <rect width='644' height='34' rx='9' fill='#F8FAFC' stroke='#E2E8F0' stroke-width='1'/>
      <path d='M 16 17 L 20 21 L 26 13' fill='none' stroke='#D97706' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
      <text x='36' y='21.5' fill='#334155' font-size='12' font-weight='600' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'>100% Client approval control • Direct local payouts</text>
    </g>
  </svg>